appId: ${APP_ID}
name: Native search and recovery
---
- runFlow: ../support/open.yaml
- runFlow:
    when:
      visible: Search
    commands:
      - tapOn: Search
- tapOn: Search components
- inputText: zz-no-such-component
- assertVisible: No matching components.*
- takeScreenshot: search-empty
# Replace the 20-character query without refocusing the native search field.
- eraseText: 20
- inputText: slider
- assertVisible:
    id: catalog-u-slider
- takeScreenshot: search-replacement
- tapOn: Clear filters
- runFlow: ../support/visible-catalog.yaml
- assertNotVisible: zz-no-such-component
- takeScreenshot: search-cleared
- tapOn: Guide
- assertVisible: Explore native components, ready-made variants, and optional customization.
- takeScreenshot: search-return-to-guide
