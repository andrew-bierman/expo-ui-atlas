appId: ${APP_ID}
name: Native catalog final-row reachability
---
- runFlow: ../support/open.yaml
- scrollUntilVisible:
    element:
      id: catalog-compose-inline-dates
    visibilityPercentage: 100
    timeout: 60000
- takeScreenshot: catalog-bottom
- tapOn:
    id: catalog-compose-inline-dates
- assertVisible: Docs
- runFlow:
    when:
      platform: ios
    commands:
      - assertVisible: Available on Android
- takeScreenshot: catalog-final-entry
